name: TypeSafeProbe
options:
  bundleIdPrefix: ai.typesafe.place
  deploymentTarget:
    iOS: '16.4'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: ai.typesafe.place.ios-probe
    MARKETING_VERSION: '0.0.1'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: App/Info.plist
    PROBE_SOURCE_SHA: unknown
    PROBE_SOURCE_DIRTY: unknown
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_ENTITLEMENTS: ''
targets:
  TypeSafeProbe:
    type: application
    platform: iOS
    sources:
      - App
      - Sources/ProbeCore
      - path: Web/probe.js
        buildPhase: resources
      - path: Web/decode-queue.js
        buildPhase: resources
      - path: Web/phase-capture.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: TypeSafeProbe
        TARGETED_DEVICE_FAMILY: 1
schemes:
  TypeSafeProbe:
    build:
      targets:
        TypeSafeProbe: all
    run:
      config: Release
    archive:
      config: Release
