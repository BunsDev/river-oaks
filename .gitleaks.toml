title = "River Oaks secret protection"

[extend]
useDefault = true

[[rules]]
id = "typesafe-api-key-assignment"
description = "TypeSafe/Jev API key assigned in configuration or code"
regex = '''(?i)(?:TYPESAFE_API_KEY|JEV_API_KEY)[\t "']*[:=][\t "']*([A-Za-z0-9_./+=-]{16,})'''
secretGroup = 1
keywords = ["typesafe_api_key", "jev_api_key"]

# Project secret types the default rules do not reliably catch. Each is
# exercised with fragment-built fake values in tests/test_secrets.py.
[[rules]]
id = "elevenlabs-api-key"
description = "ElevenLabs API key (sk_ followed by 48 hex characters)"
regex = '''\b(sk_[a-f0-9]{48})\b'''
secretGroup = 1
keywords = ["sk_"]

[[rules]]
id = "elevenlabs-api-key-assignment"
description = "ElevenLabs API key assigned in configuration or code"
regex = '''(?i)ELEVENLABS_API_KEY[\t "']*[:=][\t "']*([A-Za-z0-9_./+=-]{16,})'''
secretGroup = 1
keywords = ["elevenlabs_api_key"]

[[rules]]
id = "workos-cookie-password-assignment"
description = "WorkOS session cookie password assigned in configuration or code"
regex = '''(?i)WORKOS_COOKIE_PASSWORD[\t "']*[:=][\t "']*([^\s'"]{16,})'''
secretGroup = 1
keywords = ["workos_cookie_password"]

[[rules]]
id = "redis-url-with-password"
description = "Redis connection URL with an embedded password"
regex = '''(?i)\brediss?://[^\s:/@]*:([^\s@/]{8,})@[^\s/]+'''
secretGroup = 1
keywords = ["redis://", "rediss://"]

[[rules]]
id = "vercel-kv-or-upstash-token-assignment"
description = "Vercel KV or Upstash Redis REST token assigned in configuration or code"
regex = '''(?i)(?:KV_REST_API(?:_READ_ONLY)?_TOKEN|UPSTASH_REDIS_REST_TOKEN)[\t "']*[:=][\t "']*([A-Za-z0-9_=-]{20,})'''
secretGroup = 1
keywords = ["kv_rest_api", "upstash_redis_rest_token"]

# Five public SHA-256 digests of cached MPFB 2.0.17 tool files whose names
# contain "keys". Each was verified against its source file, not classified
# from its shape alone. Keep both the exact receipt path and exact digests;
# tests/test_secrets.py checks other values and other paths still fail.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Verified MPFB source digests in the pinned realistic-human receipt"
condition = "AND"
paths = ['''(^|/)preview/public/assets/characters/realistic-humans\.sources\.json$''']
regexTarget = "secret"
regexes = [
    '''^c478310a991b4eeac09be11a5ce4d75afe8e2a7c0e134dbc6ab98f0cfcf6a4e8$''', # entities/material/mhmatkeys.py
    '''^03c05280d8eb4fa86d686ca7206dce8a6c0e7529d7c441db12ce106509d88ea8$''', # entities/material/mhmatkeytypes.py
    '''^321076f0c47e58ae9cbf72749c6a1409189856ff99168ef57d3e7baf8a2b721c$''', # ui/operations/basemeshops/operators/bakeshapekeys.py
    '''^d585b1140c250090d60d59b70f1529ee7a6b295c492ddb0edb4ed3f1fbbcb295$''', # ui/operations/exportops/properties/bake_shapekeys.json
    '''^de5c5f535d7b0033b2b01a9afc88b467dc5ec81b402c1da2f708f3578adb0839$''', # ui/operations/faceops/operators/loadfaceshapekeys.py
]
