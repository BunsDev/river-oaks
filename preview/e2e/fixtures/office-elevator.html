<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Office elevator rendering fixture</title>
<style>html,body,#office-render{margin:0;width:100%;height:100%;overflow:hidden;background:#151a21}canvas{display:block}#phase{position:absolute;top:16px;left:16px;color:#fff;font:16px system-ui;background:#161b22cc;padding:10px;border-radius:8px}.remote-player-labels{display:none}</style>
<body><main id="office-render"></main><output id="phase">Loading fixture avatar</output>
<script type="module">
import * as THREE from 'three';
import {createOfficeScene} from '../../src/office-scene.js';
const host=document.querySelector('#office-render'),label=document.querySelector('#phase');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;host.append(renderer.domElement);
// Synthetic appearance identity only. This fixture does not join a town or grant access.
const self={id:'user_01M40Y914S1H4EJCEHH91DKTAY',name:'Jevica',appearance:'jevica',movement:'upright',office:{id:'jevica-office',position:[0,1.25],yaw:0}};
const scene=createOfficeScene({renderer,host,self,players:[self],reducedMotion:false});
window.officeFixture={time:0,frames:[],draw(seconds){this.time=seconds;const f=scene.render(seconds*1000,[0,1.25],0,[self]);label.textContent=f.phase;host.dataset.phase=f.phase;this.frames.push(f);return f;}};
let ready=false;
function load(){if(!ready){const f=window.officeFixture.draw(0);ready=f.ready;if(!ready)requestAnimationFrame(load);}}
requestAnimationFrame(load);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);window.officeFixture.draw(window.officeFixture.time);});
addEventListener('pagehide',()=>{scene.dispose();renderer.dispose();});
</script></body></html>
