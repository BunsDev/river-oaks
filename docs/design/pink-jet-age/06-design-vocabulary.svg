<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>Pink Jet-Age: the reusable vocabulary.</title><desc>A design proposal for surfaces and details. Existing logo, typography, identities and interface semantics remain authoritative.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1440" height="900" fill="#F7F1E8" stroke="none" rx="0" /><rect x="0" y="0" width="1440" height="12" fill="#F486A1" stroke="none" rx="0" /><text x="48" y="54" font-size="17" font-weight="700" fill="#24242A" text-anchor="start" >TYPESAFE PLACE  /  PINK JET-AGE  /  06 / DESIGN SYSTEM</text><text x="48" y="104" font-size="37" font-weight="700" fill="#24242A" text-anchor="start" >Pink Jet-Age: the reusable vocabulary.</text><text x="48" y="139" font-size="17" font-weight="400" fill="#24242A" text-anchor="start" >A design proposal for surfaces and details. Existing logo, typography, identities and interface semantics remain authoritative.</text><path d="M48 159L1392 159" fill="none" stroke="#C6C9C7" stroke-width="1" /><rect x="58" y="200" width="605" height="360" fill="#D8E5DF" stroke="none" rx="20" /><rect x="90" y="253" width="535" height="258" fill="#F9F5EE" stroke="#24242A" rx="36" /><rect x="102" y="292" width="510" height="165" fill="#BFE2DE" stroke="#24242A" rx="26" /><path d="M130 296L130 451" fill="none" stroke="#BCC5C8" stroke-width="8" /><path d="M184 296L184 451" fill="none" stroke="#BCC5C8" stroke-width="8" /><path d="M238 296L238 451" fill="none" stroke="#BCC5C8" stroke-width="8" /><path d="M292 296L292 451" fill="none" stroke="#BCC5C8" stroke-width="8" /><path d="M346 296L346 451" fill="none" stroke="#BCC5C8" stroke-width="8" /><path d="M400 296L400 451" fill="none" stroke="#BCC5C8" stroke-width="8" /><path d="M454 296L454 451" fill="none" stroke="#BCC5C8" stroke-width="8" /><path d="M508 296L508 451" fill="none" stroke="#BCC5C8" stroke-width="8" /><path d="M562 296L562 451" fill="none" stroke="#BCC5C8" stroke-width="8" /><rect x="90" y="262" width="535" height="24" fill="#F486A1" stroke="none" rx="12" /><rect x="90" y="464" width="535" height="19" fill="#F486A1" stroke="none" rx="9" /><circle cx="138" cy="235" r="23" fill="#4A6A55" stroke="none"/><rect x="136" y="239" width="4" height="14" fill="#4A6A55" stroke="none" rx="0" /><circle cx="222" cy="235" r="23" fill="#4A6A55" stroke="none"/><rect x="220" y="239" width="4" height="14" fill="#4A6A55" stroke="none" rx="0" /><circle cx="306" cy="235" r="23" fill="#4A6A55" stroke="none"/><rect x="304" y="239" width="4" height="14" fill="#4A6A55" stroke="none" rx="0" /><circle cx="390" cy="235" r="23" fill="#4A6A55" stroke="none"/><rect x="388" y="239" width="4" height="14" fill="#4A6A55" stroke="none" rx="0" /><circle cx="474" cy="235" r="23" fill="#4A6A55" stroke="none"/><rect x="472" y="239" width="4" height="14" fill="#4A6A55" stroke="none" rx="0" /><circle cx="558" cy="235" r="23" fill="#4A6A55" stroke="none"/><rect x="556" y="239" width="4" height="14" fill="#4A6A55" stroke="none" rx="0" /><rect x="322" y="364" width="70" height="94" fill="#FFFFFF" stroke="#24242A" rx="20" /><text x="360" y="539" font-size="14" font-weight="700" fill="#24242A" text-anchor="middle" >FORM STUDY / NOT A BUILDING PLAN</text><rect x="710" y="200" width="682" height="116" fill="#FFFFFF" stroke="#D5D7D5" rx="14" /><text x="730" y="230" font-size="19" font-weight="700" fill="#24242A" text-anchor="start" >A coherent material family</text><text x="730" y="258" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Primary accent: #F486A1, not mint or purple.</text><text x="730" y="282" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Ivory shells; mint glass; silver/chrome details.</text><text x="730" y="306" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Green planting stays visually distinct.</text><rect x="710" y="355" width="682" height="116" fill="#FFFFFF" stroke="#D5D7D5" rx="14" /><text x="730" y="385" font-size="19" font-weight="700" fill="#24242A" text-anchor="start" >Make future technology understandable</text><text x="730" y="413" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Lift shell follows the measured existing core.</text><text x="730" y="437" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Puck controls and kiosks have readable actions.</text><text x="730" y="461" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >A hologram is not an external permission grant.</text><rect x="58" y="615" width="205" height="68" fill="#F486A1" stroke="#B8BCB9" rx="12" /><text x="58" y="713" font-size="15" font-weight="700" fill="#24242A" text-anchor="start" >PINK</text><text x="58" y="738" font-size="15" font-weight="400" fill="#24242A" text-anchor="start" >#F486A1</text><rect x="282" y="615" width="205" height="68" fill="#F7F1E8" stroke="#B8BCB9" rx="12" /><text x="282" y="713" font-size="15" font-weight="700" fill="#24242A" text-anchor="start" >IVORY</text><text x="282" y="738" font-size="15" font-weight="400" fill="#24242A" text-anchor="start" >#F7F1E8</text><rect x="506" y="615" width="205" height="68" fill="#BFE2DE" stroke="#B8BCB9" rx="12" /><text x="506" y="713" font-size="15" font-weight="700" fill="#24242A" text-anchor="start" >GLASS</text><text x="506" y="738" font-size="15" font-weight="400" fill="#24242A" text-anchor="start" >#BFE2DE</text><rect x="730" y="615" width="205" height="68" fill="#BCC5C8" stroke="#B8BCB9" rx="12" /><text x="730" y="713" font-size="15" font-weight="700" fill="#24242A" text-anchor="start" >CHROME</text><text x="730" y="738" font-size="15" font-weight="400" fill="#24242A" text-anchor="start" >#BCC5C8</text><rect x="954" y="615" width="205" height="68" fill="#4A6A55" stroke="#B8BCB9" rx="12" /><text x="954" y="713" font-size="15" font-weight="700" fill="#24242A" text-anchor="start" >GARDEN</text><text x="954" y="738" font-size="15" font-weight="400" fill="#24242A" text-anchor="start" >#4A6A55</text><rect x="1178" y="615" width="205" height="68" fill="#24242A" stroke="#B8BCB9" rx="12" /><text x="1178" y="713" font-size="15" font-weight="700" fill="#24242A" text-anchor="start" >INK</text><text x="1178" y="738" font-size="15" font-weight="400" fill="#24242A" text-anchor="start" >#24242A</text><text x="58" y="790" font-size="19" font-weight="700" fill="#24242A" text-anchor="start" >Shapes: rounded canopy • capsule • porthole • pedestal • clear ring • shallow fin</text><text x="58" y="816" font-size="17" font-weight="400" fill="#24242A" text-anchor="start" >No generic neon cyberpunk, logo replacement, default-face replacement, or blanket glossy glass.</text><path d="M48 838L1392 838" fill="none" stroke="#C6C9C7" stroke-width="1" /><text x="48" y="864" font-size="14" font-weight="700" fill="#24242A" text-anchor="start" >DESIGN OVERLAY / NOT GAMEPLAY OR ACCEPTANCE EVIDENCE</text><text x="48" y="886" font-size="12" font-weight="400" fill="#24242A" text-anchor="start" >User-approved reference direction; all colors other than brand pink are proposed supporting tokens  |  source main 36e906b2  |  28 Oct 2026</text></g></svg>