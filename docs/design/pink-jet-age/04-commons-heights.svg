<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>A walkable future, not a theme-park backdrop.</title><desc>Source program extents. Building-by-building execution must use the locked destination recipes, not these colored envelopes.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1440" height="900" fill="#F7F1E8" stroke="none" rx="0" /><rect x="0" y="0" width="1440" height="12" fill="#F486A1" stroke="none" rx="0" /><text x="48" y="54" font-size="17" font-weight="700" fill="#24242A" text-anchor="start" >TYPESAFE PLACE  /  PINK JET-AGE  /  04 / COMMONS + HEIGHTS</text><text x="48" y="104" font-size="37" font-weight="700" fill="#24242A" text-anchor="start" >A walkable future, not a theme-park backdrop.</text><text x="48" y="139" font-size="17" font-weight="400" fill="#24242A" text-anchor="start" >Source program extents. Building-by-building execution must use the locked destination recipes, not these colored envelopes.</text><path d="M48 159L1392 159" fill="none" stroke="#C6C9C7" stroke-width="1" /><rect x="62" y="433.2" width="203.55" height="141.6" fill="#F3CDD8" stroke="#24242A" rx="0" /><rect x="265.55" y="206.955" width="544.275" height="514.062" fill="#E4EADF" stroke="#24242A" rx="0" /><rect x="141.65" y="433.2" width="123.9" height="141.6" fill="#C8DDC1" stroke="#24242A" rx="0" /><rect x="67.31" y="491.61" width="77.88" height="24.78" fill="#F7F1E8" stroke="#24242A" rx="0" /><rect x="265.55" y="498.69" width="65.49" height="10.62" fill="#BFE2DE" stroke="#24242A" rx="0" /><rect x="331.04" y="215.49" width="15.93" height="497.37" fill="#BFE2DE" stroke="#24242A" rx="0" /><rect x="345.2" y="215.49" width="158.415" height="277.005" fill="#BCD6B4" stroke="#24242A" rx="0" /><rect x="346.97" y="639.405" width="156.645" height="73.455" fill="#C1D9B9" stroke="#24242A" rx="0" /><rect x="504.5" y="390.72" width="203.55" height="226.56" fill="#F2CAD6" stroke="#24242A" rx="0" /><rect x="706.28" y="207.525" width="103.545" height="512.415" fill="#DAE9E3" stroke="#24242A" rx="0" /><rect x="331.04" y="490.725" width="449.58" height="26.55" fill="#F7F1E8" stroke="#24242A" rx="0" /><rect x="398.3" y="515.505" width="38.94" height="33.63" fill="#F486A1" stroke="#24242A" rx="0" /><rect x="780.62" y="490.725" width="25.665" height="26.55" fill="#F486A1" stroke="#24242A" rx="0" /><text x="191.21" y="472.14" font-size="14" font-weight="700" fill="#24242A" text-anchor="middle" >Bayou Green</text><text x="423.08" y="327" font-size="14" font-weight="700" fill="#24242A" text-anchor="middle" >Heights Green</text><text x="419.54" y="679.23" font-size="14" font-weight="700" fill="#24242A" text-anchor="middle" >Garden</text><text x="596.54" y="442.05" font-size="14" font-weight="700" fill="#24242A" text-anchor="middle" >Yale crossroads</text><text x="164.66" y="601.35" font-size="14" font-weight="700" fill="#24242A" text-anchor="middle" >Market Street → bridge</text><text x="610.7" y="539.4" font-size="14" font-weight="700" fill="#24242A" text-anchor="middle" >Nineteenth Street</text><circle cx="249.62" cy="504" r="7" fill="#F486A1" stroke="#24242A"/><text x="249.62" y="530" font-size="13" font-weight="400" fill="#24242A" text-anchor="middle" >Lantern</text><text x="62" y="201" font-size="18" font-weight="700" fill="#24242A" text-anchor="start" >N ↑</text><path d="M62 768L150.5 768" fill="none" stroke="#24242A" stroke-width="4" /><text x="62" y="794" font-size="14" font-weight="400" fill="#24242A" text-anchor="start" >50 m</text><rect x="850" y="190" width="542" height="116" fill="#FFFFFF" stroke="#D5D7D5" rx="14" /><text x="870" y="220" font-size="19" font-weight="700" fill="#24242A" text-anchor="start" >Commons: pavilion + Lantern Walk</text><text x="870" y="248" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Pink canopies; ivory shopfront frames.</text><text x="870" y="272" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >A tactile lantern, not a new game protocol.</text><text x="870" y="296" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Preserve five lantern IDs and chess seating.</text><rect x="850" y="345" width="542" height="116" fill="#FFFFFF" stroke="#D5D7D5" rx="14" /><text x="870" y="375" font-size="19" font-weight="700" fill="#24242A" text-anchor="start" >Heights: green + civic rhythm</text><text x="870" y="403" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Retain the green, icehouse and shop grain.</text><text x="870" y="427" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >A restrained space-age bandstand canopy.</text><text x="870" y="451" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Hall remains the east-axis landmark.</text><rect x="850" y="500" width="542" height="116" fill="#FFFFFF" stroke="#D5D7D5" rx="14" /><text x="870" y="530" font-size="19" font-weight="700" fill="#24242A" text-anchor="start" >One kit; deliberate local variation</text><text x="870" y="558" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Small retail stays small, not office towers.</text><text x="870" y="582" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Reuse glass, trims, plants and lamp families.</text><text x="870" y="606" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >No texture, material or mesh proliferation.</text><rect x="850" y="655" width="542" height="116" fill="#FFFFFF" stroke="#D5D7D5" rx="14" /><text x="870" y="685" font-size="19" font-weight="700" fill="#24242A" text-anchor="start" >A playable view is the acceptance unit</text><text x="870" y="713" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Arrival → lanterns → chess → bridge → return.</text><text x="870" y="737" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Two people, reconnect and load-failure escape.</text><text x="870" y="761" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >No visual-only paving that cannot be walked.</text><path d="M48 838L1392 838" fill="none" stroke="#C6C9C7" stroke-width="1" /><text x="48" y="864" font-size="14" font-weight="700" fill="#24242A" text-anchor="start" >DESIGN OVERLAY / NOT GAMEPLAY OR ACCEPTANCE EVIDENCE</text><text x="48" y="886" font-size="12" font-weight="400" fill="#24242A" text-anchor="start" >bayou-market-commons.md + bayou-heights.md; local x east of District edge, y north of -1335  |  source main 36e906b2  |  28 Oct 2026</text></g></svg>