 >798: IPIC envelope and retained party wall.</text><text x="670" y="296" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >790: garage parcel, not a new garage project.</text><rect x="650" y="345" width="742" height="116" fill="#FFFFFF" stroke="#D5D7D5" rx="14" /><text x="670" y="375" font-size="19" font-weight="700" fill="#24242A" text-anchor="start" >A new finish language, not a new map</text><text x="670" y="403" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Ivory shells; inward-rounded canopy edges.</text><text x="670" y="427" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Pink enamel accents; restrained chrome bands.</text><text x="670" y="451" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Mint-tinted glass; readable, shaded storefronts.</text><rect x="650" y="500" width="742" height="116" fill="#FFFFFF" stroke="#D5D7D5" rx="14" /><text x="670" y="530" font-size="19" font-weight="700" fill="#24242A" text-anchor="start" >A connected social district</text><text x="670" y="558" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Keep public doors, crossings and sightlines clear.</text><text x="670" y="582" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Planting belongs outside body and camera space.</text><text x="670" y="606" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Use existing gathering points before adding props.</text><rect x="650" y="655" width="742" height="116" fill="#FFFFFF" stroke="#D5D7D5" rx="14" /><text x="670" y="685" font-size="19" font-weight="700" fill="#24242A" text-anchor="start" >What this map does not establish</text><text x="670" y="713" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Later overlays other than Gardens are omitted.</text><text x="670" y="737" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >No cross-street skybridge or IPIC west-wall door.</text><text x="670" y="761" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Retain source IDs and verify the active revision.</text><path d="M48 838L1392 838" fill="none" stroke="#C6C9C7" stroke-width="1" /><text x="48" y="864" font-size="14" font-weight="700" fill="#24242A" text-anchor="start" >DESIGN OVERLAY / NOT GAMEPLAY OR ACCEPTANCE EVIDENCE</text><text x="48" y="886" font-size="12" font-weight="400" fill="#24242A" text-anchor="start" >district.json + garden-campus-layout.js; © OpenStreetMap contributors, ODbL-1.0  |  source main 36e906b2  |  28 Oct 2026</text></g></svg>