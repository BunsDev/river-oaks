" text-anchor="start" >Palette: TypeSafe pink leads; ivory, mint glass, chrome and planted green support it.</text><path d="M48 838L1392 838" fill="none" stroke="#C6C9C7" stroke-width="1" /><text x="48" y="864" font-size="14" font-weight="700" fill="#24242A" text-anchor="start" >DESIGN OVERLAY / NOT GAMEPLAY OR ACCEPTANCE EVIDENCE</text><text x="48" y="886" font-size="12" font-weight="400" fill="#24242A" text-anchor="start" >world-manifest.json; region boundaries, not walkable-area measurements  |  source main 36e906b2  |  28 Oct 2026</text></g></svg>