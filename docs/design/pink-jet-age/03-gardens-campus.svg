or="start" >Cafe</text><rect x="227.8" y="711.6" width="21.7" height="37.2" fill="#BFE2DE" stroke="#24242A" rx="0" /><text x="330" y="731.6" font-size="17" font-weight="700" fill="#24242A" text-anchor="start" >Pool</text><rect x="184.4" y="265.2" width="62" height="43.4" fill="#F7F1E8" stroke="#24242A" rx="0" /><text x="330" y="285.2" font-size="17" font-weight="700" fill="#24242A" text-anchor="start" >Pergola</text><text x="91" y="200" font-size="19" font-weight="700" fill="#24242A" text-anchor="start" >N ↑</text><text x="92" y="812" font-size="15" font-weight="400" fill="#24242A" text-anchor="start" >u → east; v → north</text><rect x="690" y="190" width="702" height="116" fill="#FFFFFF" stroke="#D5D7D5" rx="14" /><text x="710" y="220" font-size="19" font-weight="700" fill="#24242A" text-anchor="start" >Fixed dimensional contract</text><text x="710" y="248" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >B12 = 23 m; B23 = 15 m.</text><text x="710" y="272" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Deck +13 m; 4 m overall / 3 m clear.</text><text x="710" y="296" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Guard 1.25 m; slab 0.35 m.</text><rect x="690" y="345" width="702" height="116" fill="#FFFFFF" stroke="#D5D7D5" rx="14" /><text x="710" y="375" font-size="19" font-weight="700" fill="#24242A" text-anchor="start" >Public ground remains public</text><text x="710" y="403" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >6 m promenade is inside the parcel.</text><text x="710" y="427" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Existing P1-P9 approaches stay clear.</text><text x="710" y="451" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >No opening through the IPIC party wall.</text><rect x="690" y="500" width="702" height="116" fill="#FFFFFF" stroke="#D5D7D5" rx="14" /><text x="710" y="530" font-size="19" font-weight="700" fill="#24242A" text-anchor="start" >Translate the visual concept</text><text x="710" y="558" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Round shells inward, not into corridors.</text><text x="710" y="582" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Use the existing cores for the lift treatment.</text><text x="710" y="606" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Roofs: bounded gardens, not new destinations.</text><rect x="690" y="655" width="702" height="116" fill="#FFFFFF" stroke="#D5D7D5" rx="14" /><text x="710" y="685" font-size="19" font-weight="700" fill="#24242A" text-anchor="start" >Do not borrow impossible connections</text><text x="710" y="713" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >No new skybridge to the south office.</text><text x="710" y="737" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >No new bridge into IPIC.</text><text x="710" y="761" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Tenancy stays owner-issued and noncharging.</text><path d="M48 838L1392 838" fill="none" stroke="#C6C9C7" stroke-width="1" /><text x="48" y="864" font-size="14" font-weight="700" fill="#24242A" text-anchor="start" >DESIGN OVERLAY / NOT GAMEPLAY OR ACCEPTANCE EVIDENCE</text><text x="48" y="886" font-size="12" font-weight="400" fill="#24242A" text-anchor="start" >garden-campus-layout.js; heights above base altitude 18.2593918945 m  |  source main 36e906b2  |  28 Oct 2026</text></g></svg>