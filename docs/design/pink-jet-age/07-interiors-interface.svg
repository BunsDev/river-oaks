<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>The world stays prominent. The controls stay clear.</title><desc>Schematic design guidance only. Do not build floor geometry from this sheet; measure the owning layout before placing assets.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1440" height="900" fill="#F7F1E8" stroke="none" rx="0" /><rect x="0" y="0" width="1440" height="12" fill="#F486A1" stroke="none" rx="0" /><text x="48" y="54" font-size="17" font-weight="700" fill="#24242A" text-anchor="start" >TYPESAFE PLACE  /  PINK JET-AGE  /  07 / INTERIORS + INTERFACE</text><text x="48" y="104" font-size="37" font-weight="700" fill="#24242A" text-anchor="start" >The world stays prominent. The controls stay clear.</text><text x="48" y="139" font-size="17" font-weight="400" fill="#24242A" text-anchor="start" >Schematic design guidance only. Do not build floor geometry from this sheet; measure the owning layout before placing assets.</text><path d="M48 159L1392 159" fill="none" stroke="#C6C9C7" stroke-width="1" /><rect x="48" y="195" width="640" height="116" fill="#FFFFFF" stroke="#D5D7D5" rx="14" /><text x="68" y="225" font-size="19" font-weight="700" fill="#24242A" text-anchor="start" >IPIC / PUBLIC CINEMA</text><text x="68" y="253" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Bright arrival lounge, restrained pink trim.</text><text x="68" y="277" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Auditorium stays dark; screen blacks survive.</text><text x="68" y="301" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Keep seat egress, captions, controls and camera.</text><rect x="752" y="195" width="640" height="116" fill="#FFFFFF" stroke="#D5D7D5" rx="14" /><text x="772" y="225" font-size="19" font-weight="700" fill="#24242A" text-anchor="start" >OFFICES / WORLD STUDIO</text><text x="772" y="253" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Warm ivory work surfaces; chrome lamp details.</text><text x="772" y="277" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Existing desk and suite access rules stay intact.</text><text x="772" y="301" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Private Computer content is never public scenery.</text><rect x="48" y="385" width="640" height="220" fill="#E4EADF" stroke="#24242A" rx="20" /><text x="76" y="420" font-size="16" font-weight="700" fill="#24242A" text-anchor="start" >IN-WORLD CONTROL STUDY</text><rect x="76" y="448" width="584" height="64" fill="#FFFFFF" stroke="#7A8182" rx="18" /><text x="98" y="488" font-size="21" font-weight="700" fill="#24242A" text-anchor="start" >Garden lift</text><rect x="466" y="458" width="170" height="44" fill="#F486A1" stroke="#24242A" rx="18" /><text x="551" y="486" font-size="17" font-weight="700" fill="#24242A" text-anchor="middle" >Open controls</text><text x="76" y="553" font-size="17" font-weight="400" fill="#24242A" text-anchor="start" >Visible focus • readable labels • no color-only state</text><text x="76" y="582" font-size="15" font-weight="400" fill="#24242A" text-anchor="start" >Do not silently convert a level transition into teleportation.</text><rect x="752" y="385" width="640" height="220" fill="#F2DCE3" stroke="#24242A" rx="20" /><text x="780" y="420" font-size="16" font-weight="700" fill="#24242A" text-anchor="start" >WARDROBE / HUMAN IDENTITY</text><text x="780" y="465" font-size="20" font-weight="700" fill="#24242A" text-anchor="start" >Keep the face, hair, proportions and character history.</text><text x="780" y="507" font-size="17" font-weight="400" fill="#24242A" text-anchor="start" >New tailored silhouettes are opt-in clothing, not new identities.</text><text x="780" y="548" font-size="17" font-weight="400" fill="#24242A" text-anchor="start" >Validate walking, sitting, stairs, wings and camera clearance.</text><text x="780" y="580" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >No real-likeness intake. No changes to existing nonhuman assets.</text><rect x="48" y="645" width="640" height="92" fill="#FFFFFF" stroke="#D5D7D5" rx="14" /><text x="68" y="675" font-size="19" font-weight="700" fill="#24242A" text-anchor="start" >PUBLIC STATE</text><text x="68" y="703" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Avatar, presence and permitted shared activity.</text><text x="68" y="727" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >No owner secrets in props, holograms or monitor textures.</text><rect x="752" y="645" width="640" height="92" fill="#FFFFFF" stroke="#D5D7D5" rx="14" /><text x="772" y="675" font-size="19" font-weight="700" fill="#24242A" text-anchor="start" >LOCAL PRIVATE STATE</text><text x="772" y="703" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Account confirmation and explicit, revocable authority.</text><text x="772" y="727" font-size="16" font-weight="400" fill="#24242A" text-anchor="start" >Keep original browser focus, lifecycle and privacy tests.</text><path d="M48 838L1392 838" fill="none" stroke="#C6C9C7" stroke-width="1" /><text x="48" y="864" font-size="14" font-weight="700" fill="#24242A" text-anchor="start" >DESIGN OVERLAY / NOT GAMEPLAY OR ACCEPTANCE EVIDENCE</text><text x="48" y="886" font-size="12" font-weight="400" fill="#24242A" text-anchor="start" >Design schematic; read current IPIC, office, studio, appearance and HUD owners before implementation  |  source main 36e906b2  |  28 Oct 2026</text></g></svg>