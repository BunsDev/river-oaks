# Temporary: reproduces the photo-mode and rail-navigation failures under Mesa
# for fix/mesa-experience-journeys. Remove before merging.
name: Mesa experience diagnostics
on:
  pull_request:
    paths:
      - .github/workflows/mesa-experience-diagnostics.yml
      - preview/e2e/**
      - preview/src/**
permissions:
  contents: read
jobs:
  mesa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RIVER_OAKS_EXPERIENCE_SOFTWARE: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      LP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Render probe variants
        run: xvfb-run -a node preview/e2e/mesa-probe.mjs || echo "probe exit $?"
      - name: Diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mesa-experience-diagnostics
          retention-days: 7
          path: |
            data/reports/mesa-*.json
            output/mesa-default/
            output/mesa-probe/
            output/playwright/photo-*.png
