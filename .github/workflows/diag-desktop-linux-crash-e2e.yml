name: Diag Linux renderer crash recovery (#370)
# Diagnostic branch only, never merged. Runs the development desktop e2e on
# ubuntu-latest with the image's systemd-coredump pipe left on, twice:
# "before" restores main's desktop/main.js (no core-dump watch) and widens only
# the crash-recovery wait so the real delay is measured; "after" is the fix
# exactly as it will merge, with the e2e's 60 s recovery check unchanged.
on:
  push:
    branches: ['diag/desktop-linux-crash-370-e2e-*']
permissions:
  contents: read
jobs:
  e2e:
    name: linux crash recovery (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends openbox
      - name: Core handling on this runner
        run: |
          cat /proc/sys/kernel/core_pattern /proc/sys/fs/suid_dumpable
          ulimit -c
      # HEAD is this diag commit, HEAD~1 the fix, HEAD~2 main.
      - name: Restore main's main.js and widen only the crash wait (before)
        if: matrix.variant == 'before'
        run: |
          git show HEAD~2:desktop/main.js > desktop/main.js
          grep -c 'core-dump-watch' desktop/main.js || true
          sed -i 's/^      }, 60000);$/      }, 420000);/' desktop/e2e.js
          grep -n '420000' desktop/e2e.js
      - name: Development desktop end-to-end (loopback acceptance fixture)
        env:
          RIVER_OAKS_ACCEPTANCE_FIXTURE: '1'
          RIVER_OAKS_DESKTOP_REPORT: desktop-ci-linux-${{ matrix.variant }}.json
          ELECTRON_ENABLE_LOGGING: '1'
          RIVER_OAKS_DESKTOP_LAUNCH_TIMEOUT: '120000'
        run: |
          export RIVER_OAKS_DESKTOP_SOFTWARE=1 LIBGL_ALWAYS_SOFTWARE=1 LP_NUM_THREADS=2
          xvfb-run -a bash -c 'openbox --sm-disable & sleep 1; exec pnpm run test:desktop:e2e --dev'
      - name: Core dumps recorded
        if: ${{ !cancelled() }}
        run: coredumpctl list --no-pager || true
      - name: Receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diag-linux-crash-${{ matrix.variant }}
          retention-days: 14
          if-no-files-found: ignore
          path: data/reports/desktop-ci-linux-${{ matrix.variant }}.json
