name: Verify
on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# A newer push to the same pull request (an edit, or the lander's update from main)
# supersedes the older run; cancelling it frees runners for the run that matters.
# main, the weekly schedule and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  dependency-review:
    # Fails a pull request that adds a dependency with a known vulnerability
    # (moderate or worse) or an incompatible licence change.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
  # The required "preview" check used to be one serial job of about 24 minutes,
  # almost all of it two browser suites. These jobs run the same commands in
  # parallel; the final "preview" job reports the required check.
  # Unit tests alone take about 8 minutes on a hosted runner, so they run beside
  # the server, desktop and browser checks instead of before them.
  preview-unit:
    name: preview unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit locked JavaScript dependencies
        run: pnpm audit --audit-level=moderate
      - run: pnpm run verify tooling
      - name: Agent tooling receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-tooling-receipt
          retention-days: 7
          path: .runtime/agent/tooling.json
          include-hidden-files: true
      - run: pnpm test
  preview-checks:
    name: preview checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Redis-backed server tests (auth, sessions, rooms, presence, designs, groups)
    # skip without REDIS_URL; this service runs them, as production uses Redis.
    services:
      redis:
        image: mirror.gcr.io/library/redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install local Redis recovery prerequisite
        run: command -v redis-server || (sudo apt-get update && sudo apt-get install -y redis-server)
      - run: pnpm run test:server
        env:
          REDIS_URL: redis://127.0.0.1:6379
      - run: pnpm run test:desktop
      # Each browser job used to download Chromium from Playwright's CDN; restore
      # the browsers by Playwright version instead. Install still adds the system
      # packages and skips browsers that are already present.
      - name: Playwright version
        id: playwright
        run: |
          echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The system packages come from the runner's Ubuntu mirror, which some runs serve at
      # about 45 kB/s: a 26 MB install took 9.5 min and pushed shards past their 20 min.
      # Reuse downloaded .deb files per runner image, refreshed daily. apt accepts a file
      # already in its archive by size alone, so only files whose SHA256 matches the current
      # package index are placed there; anything else is downloaded as before.
      - name: Playwright system package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt
          key: playwright-apt-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.day }}
          restore-keys: playwright-apt-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-
      - run: |
          if compgen -G "$HOME/.cache/playwright-apt/*.deb" > /dev/null; then
            sudo apt-get update -qq || true
            placed=0
            for deb in "$HOME"/.cache/playwright-apt/*.deb; do
              pkg=$(dpkg-deb -f "$deb" Package 2>/dev/null) || continue
              version=$(dpkg-deb -f "$deb" Version 2>/dev/null) || continue
              arch=$(dpkg-deb -f "$deb" Architecture 2>/dev/null) || continue
              if [ "$arch" = all ]; then spec="$pkg=$version"; else spec="$pkg:$arch=$version"; fi
              want=$(apt-cache show "$spec" 2>/dev/null | awk '/^SHA256:/ { print $2; exit }')
              if [ -n "$want" ] && [ "$(sha256sum "$deb" | cut -d' ' -f1)" = "$want" ]; then sudo cp "$deb" /var/cache/apt/archives/; placed=$((placed + 1)); fi
            done
            echo "Placed $placed cached package(s) that match the package index"
          fi
          pnpm exec playwright install --with-deps chromium
          if compgen -G "/var/cache/apt/archives/*.deb" > /dev/null; then
            rm -rf "$HOME/.cache/playwright-apt"; mkdir -p "$HOME/.cache/playwright-apt"
            cp /var/cache/apt/archives/*.deb "$HOME/.cache/playwright-apt/"
          fi
      - run: pnpm run build
      - name: Email access and content security browser regressions
        id: security_browser
        # Use the same Mesa path as shared journeys instead of headless SwiftShader.
        env:
          RIVER_OAKS_SECURITY_SOFTWARE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
        run: xvfb-run -a pnpm run test:security:e2e
      - name: Security browser failure evidence
        if: ${{ failure() && steps.security_browser.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-browser-failure
          retention-days: 7
          path: output/playwright/security-*-failure.png
      - run: pnpm run test:reflections:webgl
      - name: IPIC screening journey (two browsers, host controls, late join within 500 ms)
        id: screening_browser
        # The same Mesa path as the shared and security journeys. Val chose hosted coverage of the
        # screening journey on 2026-10-18; the ten-cycle soak stays a local profile.
        env:
          RIVER_OAKS_SCREENING_SOFTWARE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
        run: xvfb-run -a pnpm run test:screening
      - name: Screening journey failure evidence
        if: ${{ failure() && steps.screening_browser.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screening-browser-failure
          retention-days: 7
          path: |
            output/playwright/ipic/screening.json
            output/playwright/ipic/screening-*-failure.png
  preview-shared:
    name: preview shared (${{ matrix.shard.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every shard reports, so one failing journey doesn't hide another.
      fail-fast: false
      matrix:
        # Shards are shared-runner modes, balanced by their CI durations.
        shard:
          - id: required
            modes: required
          # The character journeys (about 6 min) left required near the 20-min cut.
          - id: required-characters
            modes: required-characters
          - id: development
            modes: development
          - id: worlds-and-creator
            modes: development-world development-publish creator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each browser job used to download Chromium from Playwright's CDN; restore
      # the browsers by Playwright version instead. Install still adds the system
      # packages and skips browsers that are already present.
      - name: Playwright version
        id: playwright
        run: |
          echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The system packages come from the runner's Ubuntu mirror, which some runs serve at
      # about 45 kB/s: a 26 MB install took 9.5 min and pushed shards past their 20 min.
      # Reuse downloaded .deb files per runner image, refreshed daily. apt accepts a file
      # already in its archive by size alone, so only files whose SHA256 matches the current
      # package index are placed there; anything else is downloaded as before.
      - name: Playwright system package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt
          key: playwright-apt-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.day }}
          restore-keys: playwright-apt-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-
      - run: |
          if compgen -G "$HOME/.cache/playwright-apt/*.deb" > /dev/null; then
            sudo apt-get update -qq || true
            placed=0
            for deb in "$HOME"/.cache/playwright-apt/*.deb; do
              pkg=$(dpkg-deb -f "$deb" Package 2>/dev/null) || continue
              version=$(dpkg-deb -f "$deb" Version 2>/dev/null) || continue
              arch=$(dpkg-deb -f "$deb" Architecture 2>/dev/null) || continue
              if [ "$arch" = all ]; then spec="$pkg=$version"; else spec="$pkg:$arch=$version"; fi
              want=$(apt-cache show "$spec" 2>/dev/null | awk '/^SHA256:/ { print $2; exit }')
              if [ -n "$want" ] && [ "$(sha256sum "$deb" | cut -d' ' -f1)" = "$want" ]; then sudo cp "$deb" /var/cache/apt/archives/; placed=$((placed + 1)); fi
            done
            echo "Placed $placed cached package(s) that match the package index"
          fi
          pnpm exec playwright install --with-deps chromium
          if compgen -G "/var/cache/apt/archives/*.deb" > /dev/null; then
            rm -rf "$HOME/.cache/playwright-apt"; mkdir -p "$HOME/.cache/playwright-apt"
            cp /var/cache/apt/archives/*.deb "$HOME/.cache/playwright-apt/"
          fi
      - run: pnpm run build
      - name: Shared town journeys (local identities and authenticated fixtures)
        id: shared
        # Mesa under Xvfb avoids Chromium headless-shell's SwiftShader stalls.
        # Keep real scene/transport assertions with the explicit CPU render budget.
        env:
          RIVER_OAKS_SHARED_SOFTWARE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
          SHARED_MODES: ${{ matrix.shard.modes }}
        run: |
          read -ra modes <<< "$SHARED_MODES"
          xvfb-run -a pnpm run test:shared "${modes[@]}"
      - name: Shared town failure evidence
        if: ${{ failure() && steps.shared.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-town-failure-${{ matrix.shard.id }}
          retention-days: 7
          path: |
            data/reports/shared-experience.json
            output/playwright/shared-*-failure.png
  preview-experience:
    name: preview experience (${{ matrix.shard.id }})
    runs-on: ubuntu-latest
    # Places includes the full office/Computer lifecycle suite; leave time for setup and cleanup.
    timeout-minutes: ${{ matrix.shard.id == 'places' && 30 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        # spatial-streets alone takes about as long as the other journeys combined.
        shard:
          - id: streets
            journeys: spatial-streets world-studio city-kit-studio
          - id: places
            journeys: contextual-first-visit store-intro photo-mode rail-navigation places-guide destination-minimap spatial-circulation office-desk office-visit office-lift-ride office-computer-embed
          # The Gardens campus revision: leases, workstations and the private desk (#510), and
          # public traversal of lifts, stairs and both skywalks (#508).
          - id: campus
            journeys: garden-campus-office garden-campus-suite
          - id: campus-traversal
            journeys: garden-campus-traversal
          - id: commons
            journeys: east-garden-commons
          # Bayou Heights over the Lantern Footbridge (#586 continuation). One journey used to walk
          # in, play, reconnect and walk home: 14-19.5 min on this runner against the 20-min timeout,
          # and twice cancelled at it (f4dd959a, f3b01149). Outbound and return are separate shards.
          - id: heights
            journeys: bayou-heights
          - id: heights-return
            journeys: bayou-heights-return
          # Studewood beyond Heights Boulevard (toward 3x), in its own shard.
          - id: studewood
            journeys: studewood
          # The Bayou Terraces beside the Commons, over their footbridges from Heights.
          - id: terraces
            journeys: bayou-terraces
          # Woodland Heights east of Studewood, along Twentieth Street (toward 3x).
          - id: woodland
            journeys: woodland-heights
          # Sign-in settles without flicker: the redirect splash, then every visible
          # state (theme, gate, Character Studio button, character) moves one way only.
          - id: access
            journeys: access-gate login-flicker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each browser job used to download Chromium from Playwright's CDN; restore
      # the browsers by Playwright version instead. Install still adds the system
      # packages and skips browsers that are already present.
      - name: Playwright version
        id: playwright
        run: |
          echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The system packages come from the runner's Ubuntu mirror, which some runs serve at
      # about 45 kB/s: a 26 MB install took 9.5 min and pushed shards past their 20 min.
      # Reuse downloaded .deb files per runner image, refreshed daily. apt accepts a file
      # already in its archive by size alone, so only files whose SHA256 matches the current
      # package index are placed there; anything else is downloaded as before.
      - name: Playwright system package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt
          key: playwright-apt-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.day }}
          restore-keys: playwright-apt-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-
      - run: |
          if compgen -G "$HOME/.cache/playwright-apt/*.deb" > /dev/null; then
            sudo apt-get update -qq || true
            placed=0
            for deb in "$HOME"/.cache/playwright-apt/*.deb; do
              pkg=$(dpkg-deb -f "$deb" Package 2>/dev/null) || continue
              version=$(dpkg-deb -f "$deb" Version 2>/dev/null) || continue
              arch=$(dpkg-deb -f "$deb" Architecture 2>/dev/null) || continue
              if [ "$arch" = all ]; then spec="$pkg=$version"; else spec="$pkg:$arch=$version"; fi
              want=$(apt-cache show "$spec" 2>/dev/null | awk '/^SHA256:/ { print $2; exit }')
              if [ -n "$want" ] && [ "$(sha256sum "$deb" | cut -d' ' -f1)" = "$want" ]; then sudo cp "$deb" /var/cache/apt/archives/; placed=$((placed + 1)); fi
            done
            echo "Placed $placed cached package(s) that match the package index"
          fi
          pnpm exec playwright install --with-deps chromium
          if compgen -G "/var/cache/apt/archives/*.deb" > /dev/null; then
            rm -rf "$HOME/.cache/playwright-apt"; mkdir -p "$HOME/.cache/playwright-apt"
            cp /var/cache/apt/archives/*.deb "$HOME/.cache/playwright-apt/"
          fi
      - run: pnpm run build
      - name: Contextual action, photo and command journeys
        id: experience
        # Same Mesa/Xvfb CPU path as the shared and security journeys.
        env:
          RIVER_OAKS_EXPERIENCE_SOFTWARE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
          RIVER_OAKS_E2E_REPORT: ci-experience.json
          EXPERIENCE_JOURNEYS: ${{ matrix.shard.journeys }}
        run: |
          read -ra journeys <<< "$EXPERIENCE_JOURNEYS"
          xvfb-run -a pnpm run test:experience "${journeys[@]}"
      - name: Experience journey failure evidence
        if: ${{ failure() && steps.experience.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: experience-failure-${{ matrix.shard.id }}
          retention-days: 7
          path: |
            data/reports/ci-experience.json
            output/playwright/experience-*-failure.png
  preview:
    # The main ruleset requires a check named "preview". It passes only when
    # every preview job passed; a failed, cancelled or skipped job fails it.
    if: ${{ always() }}
    needs: [preview-unit, preview-checks, preview-shared, preview-experience]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every preview job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Preview job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Pull requests check the newest supported Python; main and the weekly run check both.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
          version: '0.11.3'
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          curl -fsSLo /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf /tmp/gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Secret checks (worktree and full history)
        run: |
          python3 scripts/check_secrets.py --all
          gitleaks git --log-opts=--all --redact --no-banner --ignore-gitleaks-allow
      - name: Feature PRs leave the task register snapshot alone
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: node scripts/check-register-snapshot.mjs "$BASE_REF" "$HEAD_BRANCH"
      - run: uv sync --locked
      - name: Audit locked Python runtime dependencies
        run: |
          uv export --frozen --all-extras --no-hashes --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/requirements-audit.txt" > /dev/null
          uvx pip-audit==2.10.1 --no-deps --disable-pip -r "$RUNNER_TEMP/requirements-audit.txt"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # The geographic-reference round trip invokes the production Node compiler.
      # Install its locked dependencies without downloading desktop binaries.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: uv run pytest -q
      - name: Offline pipeline smoke test
        run: |
          uv run river-oaks demo
          set +e
          uv run river-oaks verify --config data/generated/demo/config.json --raw data/generated/demo --world data/generated/demo/world.json --output data/generated/demo/report.json
          result=$?
          set -e
          test "$result" -eq 2
