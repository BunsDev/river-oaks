name: Verify
on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  dependency-review:
    # Fails a pull request that adds a dependency with a known vulnerability
    # (moderate or worse) or an incompatible licence change.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Redis-backed server tests (auth, sessions, rooms, presence, designs, groups)
    # skip without REDIS_URL; this service runs them, as production uses Redis.
    services:
      redis:
        image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit locked JavaScript dependencies
        run: pnpm audit --audit-level=moderate
      - run: pnpm run verify tooling
      - name: Agent tooling receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-tooling-receipt
          retention-days: 7
          path: .runtime/agent/tooling.json
          include-hidden-files: true
      - run: pnpm test
      - run: pnpm run test:server
        env:
          REDIS_URL: redis://127.0.0.1:6379
      - run: pnpm run test:desktop
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - name: Email access and content security browser regressions
        id: security_browser
        # Use the same Mesa path as shared journeys instead of headless SwiftShader.
        env:
          RIVER_OAKS_SECURITY_SOFTWARE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
        run: xvfb-run -a pnpm run test:security:e2e
      - name: Security browser failure evidence
        if: ${{ failure() && steps.security_browser.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-browser-failure
          retention-days: 7
          path: output/playwright/security-*-failure.png
      - run: pnpm run test:reflections:webgl
      - name: Shared town journeys (local identities and authenticated fixtures)
        id: shared
        # Mesa under Xvfb avoids Chromium headless-shell's SwiftShader stalls.
        # Keep real scene/transport assertions with the explicit CPU render budget.
        env:
          RIVER_OAKS_SHARED_SOFTWARE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
        run: xvfb-run -a pnpm run test:shared
      - name: Shared town failure evidence
        if: ${{ failure() && steps.shared.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-town-failure
          retention-days: 7
          path: |
            data/reports/shared-experience.json
            output/playwright/shared-*-failure.png
      - name: Contextual action, photo and command journeys
        id: experience
        # Also runs when only the shared journeys failed, so both regressions
        # report. Same Mesa/Xvfb CPU path as the shared and security journeys.
        if: ${{ !cancelled() && (success() || steps.shared.outcome == 'failure') }}
        env:
          RIVER_OAKS_EXPERIENCE_SOFTWARE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
          RIVER_OAKS_E2E_REPORT: ci-experience.json
        run: xvfb-run -a pnpm run test:experience contextual-first-visit photo-mode rail-navigation
      - name: Experience journey failure evidence
        if: ${{ failure() && steps.experience.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: experience-failure
          retention-days: 7
          path: |
            data/reports/ci-experience.json
            output/playwright/experience-*-failure.png
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: ${{ matrix.python }}
          version: '0.11.3'
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          curl -fsSLo /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf /tmp/gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Secret checks (worktree and full history)
        run: |
          python3 scripts/check_secrets.py --all
          gitleaks git --log-opts=--all --redact --no-banner --ignore-gitleaks-allow
      - run: uv sync --locked
      - name: Audit locked Python runtime dependencies
        run: |
          uv export --frozen --all-extras --no-hashes --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/requirements-audit.txt" > /dev/null
          uvx pip-audit==2.10.1 --no-deps --disable-pip -r "$RUNNER_TEMP/requirements-audit.txt"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Offline pipeline smoke test
        run: |
          uv run river-oaks demo
          set +e
          uv run river-oaks verify --config data/generated/demo/config.json --raw data/generated/demo --world data/generated/demo/world.json --output data/generated/demo/report.json
          result=$?
          set -e
          test "$result" -eq 2
