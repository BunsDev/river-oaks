name: Verify
# DIAGNOSTIC BRANCH ONLY (diag/heights-west-draw-20261024): the heights journey with a
# draw-cost probe, dispatched by hand. Never merged; the PR keeps the full Verify workflow.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-experience:
    name: preview experience (${{ matrix.shard.id }})
    runs-on: ubuntu-latest
    # Places includes the full office/Computer lifecycle suite; leave time for setup and cleanup.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # spatial-streets alone takes about as long as the other journeys combined.
        shard:
          - id: heights
            journeys: bayou-heights
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each browser job used to download Chromium from Playwright's CDN; restore
      # the browsers by Playwright version instead. Install still adds the system
      # packages and skips browsers that are already present.
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - name: Contextual action, photo and command journeys
        id: experience
        # Same Mesa/Xvfb CPU path as the shared and security journeys.
        env:
          RIVER_OAKS_EXPERIENCE_SOFTWARE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
          RIVER_OAKS_E2E_REPORT: ci-experience.json
          EXPERIENCE_JOURNEYS: ${{ matrix.shard.journeys }}
        run: |
          read -ra journeys <<< "$EXPERIENCE_JOURNEYS"
          xvfb-run -a pnpm run test:experience "${journeys[@]}"
      - name: Experience journey failure evidence
        if: ${{ failure() && steps.experience.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: experience-failure-${{ matrix.shard.id }}
          retention-days: 7
          path: |
            data/reports/ci-experience.json
            output/playwright/experience-*-failure.png
      - name: Heights journey captures (diagnostic branch only)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: heights-captures
          retention-days: 7
          path: output/playwright/heights-*.png
