# Weekly dependency updates, grouped so routine minor and patch bumps arrive as
# one PR per ecosystem. Security updates are separate and immediate (enabled in
# the repository's security settings).
version: 2
updates:
  # GitHub calls the pnpm lockfile ecosystem "npm".
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pnpm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The Dockerfile pins its base image by digest; this proposes digest and
  # minor updates so the pin keeps receiving security fixes. Node majors stay a
  # deliberate change.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
