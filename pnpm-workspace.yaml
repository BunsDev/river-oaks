packages:
  - .
enablePrePostScripts: true
onlyBuiltDependencies:
  - electron
  - esbuild
overrides:
  # GHSA-mrhx-c7xc-m3w5: @vercel/cli-config pins zod 4.1.11 exactly, even in its latest release.
  zod: 4.6.7
  # GHSA-g3hv-75wg-m249 (minimatch <11.0.1) and GHSA-3g3m-2fjr-6pw4 (glob 9-14.0.1):
  # @electron/asar 4 (via @electron/packager) imports both by name, which the patched
  # majors keep.
  '@electron/asar@4>minimatch': 11.0.1
  '@electron/asar@4>glob': 14.0.2
auditConfig:
  ignoreGhsas:
    # minimatch 3.1.5 remains only in @electron/asar 3 under electron-winstaller, which
    # calls asar.extractFile alone; asar matches patterns only when building a package.
    # minimatch has no patched 3.x, and asar 3 default-imports it, which 11 does not export.
    - GHSA-g3hv-75wg-m249
