[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "river-oaks"
version = "0.1.0"
description = "Geospatial build and reactive simulation bridge for River Oaks UE5"
requires-python = ">=3.11"
dependencies = [
    "shapely>=2.1,<3",
    "pyproj>=3.7,<4",
    "httpx>=0.28,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "rasterio>=1.4,<2",
    "laspy>=2.6,<3",
    "lazrs>=0.7,<1",
]

[project.scripts]
river-oaks = "river_oaks.cli:main"

[project.optional-dependencies]
voice = [
    "kokoro-onnx==0.4.9",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

